name: Build Ar Pharma POS v3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v3_final_parts/**'
      - '.github/workflows/ar-pharma-pos-v3-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and verify Ar Pharma POS v3 source
        shell: bash
        run: |
          cat v3_final_parts/part00.b64 v3_final_parts/part01.b64 v3_final_parts/part02.b64 v3_final_parts/part03.b64 v3_final_parts/part04.b64 v3_final_parts/part05.b64 v3_final_parts/part06.b64 v3_final_parts/part07.b64 > ar-v3.b64
          base64 --decode ar-v3.b64 > Ar-Pharma-POS-v3-final-source.zip
          echo "235f4b95de3b5bf687f70b6163a0af031d005689a9f23f46e3d78180a19902f8  Ar-Pharma-POS-v3-final-source.zip" | sha256sum --check --strict
          unzip -q Ar-Pharma-POS-v3-final-source.zip
          test -f ArPharmaPOS-v3/app/build.gradle
          test -f ArPharmaPOS-v3/app/src/main/AndroidManifest.xml

      - name: Build v3 debug APK
        working-directory: ArPharmaPOS-v3
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s ArPharmaPOS-v3/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ArPharmaPOS-v3/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Ar Pharma POS v3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ar-Pharma-POS-v3-APK
          path: ArPharmaPOS-v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
