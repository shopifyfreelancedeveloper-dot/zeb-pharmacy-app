name: Build Zeb Pharmacy APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and verify Zeb Pharmacy v2 source
        shell: bash
        run: |
          cat source_parts/part01.b64 source_parts/part02.b64 source_parts/part03.b64 source_parts/part04.b64 source_parts/part05.b64 source_parts/part06.b64 > ZebPharmacy-Android-v2-source.b64
          base64 --decode ZebPharmacy-Android-v2-source.b64 > ZebPharmacy-Android-v2-source.zip
          echo "d6a18da46a4622d984a489dceb9b00227503c694aaecd762e15bebb4cb64a0b8  ZebPharmacy-Android-v2-source.zip" | sha256sum --check --strict
          unzip -q ZebPharmacy-Android-v2-source.zip
          test -f ZebPharmacy-v2/app/build.gradle
          test -f ZebPharmacy-v2/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: ZebPharmacy-v2
        run: gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s ZebPharmacy-v2/app/build/outputs/apk/debug/app-debug.apk
          sha256sum ZebPharmacy-v2/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeb-Pharmacy-APK
          path: ZebPharmacy-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
