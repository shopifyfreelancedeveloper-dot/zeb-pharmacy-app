name: Repair Build Ar Pharma POS v3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct stable v3 source
        shell: bash
        run: |
          cat v3_source_parts/part00.b64 v3_source_parts/part01.b64 v3_source_parts/part02.b64 v3_source_parts/part03.b64 > stable-v3.b64
          base64 --decode stable-v3.b64 > stable-v3.zip
          unzip -t stable-v3.zip
          unzip -q stable-v3.zip
          echo '--- project roots ---'
          find . -maxdepth 3 -name settings.gradle -print
      - name: Build stable v3 APK
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find . -maxdepth 3 -name settings.gradle | head -1)")"
          echo "Building from $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
      - name: Collect APK
        shell: bash
        run: |
          APK="$(find . -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -1)"
          test -s "$APK"
          cp "$APK" Ar-Pharma-POS-v3.apk
          sha256sum Ar-Pharma-POS-v3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ar-Pharma-POS-v3-Repair
          path: Ar-Pharma-POS-v3.apk
          if-no-files-found: error
          retention-days: 30
